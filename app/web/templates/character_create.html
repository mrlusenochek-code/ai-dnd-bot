<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <title>Создание персонажа</title>
  <style>
    body{font-family:Arial,sans-serif; margin:0; background:#f6f7fb;}
    .wrap{max-width:1400px; margin:24px auto; padding:0 12px;}

    /* 3 зоны: Race | Form | (Class + Stats) */
    .grid{
      display:grid;
      grid-template-columns: minmax(240px, 1fr) minmax(360px, 1.2fr) minmax(620px, 2fr);
      gap:14px;
      align-items:start;
    }

    /* Правая зона: Class | Stats */
    .right-col{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:14px;
      align-items:start;
    }
    .card{background:#fff; border:1px solid #d6dae5; border-radius:12px; padding:14px;}
    .row{display:flex; gap:10px; align-items:center; margin-top:10px;}
    label{display:block; margin-top:10px; font-size:14px; color:#3c445c;}
    input,select,textarea,button{font-size:14px; padding:8px 10px;}
    input,select,textarea{width:100%; box-sizing:border-box;}
    textarea{min-height:80px; resize:vertical;}
    .stat{display:grid; grid-template-columns:90px 40px 1fr 40px 50px; gap:8px; align-items:center; margin-top:8px;}
    .muted{opacity:.7;}
    .msg{margin-top:10px; font-size:14px;}
    .err{color:#ab2638;}
    .ok{color:#14631e;}
    .race-panel{
      margin-top:0;
      border:1px solid #e1e5ee;
      border-radius:10px;
      padding:12px;
      background:#f9fbff;
    }
    .race-panel h3{margin:0 0 6px 0; font-size:18px;}
    .race-text{margin:0; color:#2d3550; line-height:1.35;}
    .race-section{margin-top:10px;}
    .race-section b{display:block; margin-bottom:4px;}
    .race-list{margin:0; padding-left:18px;}
    .race-list li{margin:2px 0;}
    .race-list li b{display:block;}
    .race-list li .muted{display:block; margin-top:2px; font-size:12px; line-height:1.25;}
    .race-list details summary{cursor:pointer;}
    .race-list details{margin-top:2px;}
    @media (max-width: 1200px){
      .grid{grid-template-columns:1fr 1fr;}
      .right-col{grid-column:1 / -1;} /* Class+Stats уезжают на строку ниже, но остаются рядом */
    }
    @media (max-width: 900px){
      .right-col{grid-template-columns:1fr;} /* Class над Stats */
    }
    @media (max-width: 760px){
      .grid{grid-template-columns:1fr;}
      .right-col{grid-column:auto;}
    }
  </style>
</head>
<body>
<div class="wrap">
  <h2>Создай персонажа</h2>
  <p class="muted">Session: <code id="sid"></code></p>
  <div class="grid">

    <!-- СЛЕВА: детали расы -->
    <div id="racePanel" class="race-panel">
      <h3 id="raceTitle">Раса</h3>
      <p id="raceText" class="race-text">Описание будет добавлено позже.</p>
      <div class="race-section">
        <b>Особенности</b>
        <ul id="raceTraits" class="race-list"></ul>
      </div>
      <div class="race-section">
        <b>Разновидности</b>
        <ul id="raceSubraces" class="race-list"></ul>
      </div>
    </div>

    <!-- ЦЕНТР: форма создания -->
    <div class="card">
      <label>Имя персонажа</label>
      <input id="charName" placeholder="Алена"/>

      <label>Раса (preset)</label>
      <select id="raceId"></select>

      <label>Или своя раса (опционально)</label>
      <input id="customRace" placeholder="Half-Orc"/>

      <div id="subraceRow" style="display:none;">
        <label>Вариант / разновидность</label>
        <select id="subraceId"></select>
      </div>

      <div id="raceChoices" style="display:none;">
        <label>Стартовые выборы</label>
        <div id="choiceLangRow">
          <label>Доп. язык (обязательно)</label>
          <select id="choiceLang1"></select>
        </div>
        <div id="choiceAsiRow" style="display:none;">
          <label>ASI +1 к двум разным характеристикам (обязательно)</label>
          <div class="row">
            <select id="choiceAsi1"></select>
            <select id="choiceAsi2"></select>
          </div>
        </div>
      </div>

      <label>Класс (preset)</label>
      <select id="classId"></select>

      <label>Или свой класс (опционально)</label>
      <input id="customClass" placeholder="Shadowblade"/>

      <label>Пол (опционально)</label>
      <input id="gender" placeholder="Ж"/>

      <label>Описание (опционально)</label>
      <textarea id="desc" placeholder="Короткая биография"></textarea>

      <div class="row">
        <button onclick="createHero()">Create Hero</button>
        <button onclick="goSession()">Go to session</button>
      </div>
      <div id="msg" class="msg muted"></div>
    </div>

    <!-- СПРАВА: Class + Stats -->
    <div class="right-col">

      <!-- справа от формы: детали класса -->
      <div id="classPanel" class="race-panel">
        <h3 id="classTitle">Класс</h3>
        <p id="classText" class="race-text">Описание будет добавлено позже.</p>

        <div class="race-section">
          <b>Основные характеристики</b>
          <ul id="classAbilities" class="race-list"></ul>
        </div>

        <div class="race-section">
          <b>Спасброски</b>
          <ul id="classSaves" class="race-list"></ul>
        </div>

        <div class="race-section">
          <b>Архетипы</b>
          <ul id="classSubclasses" class="race-list"></ul>
        </div>
      </div>

      <!-- самый правый: статы -->
      <div class="card">
        <h3 style="margin-top:0;">Статы</h3>
        <div class="muted">Available points: <b id="pointsLeft">20</b></div>
        <div id="statsBox"></div>
        <div class="row">
          <button onclick="resetStats()">Reset</button>
        </div>
      </div>

    </div>
  </div>
</div>

<script>
const SESSION_ID = "{{ session_id }}";
const STAT_KEYS = ["str","dex","con","int","wis","cha"];
const LANGUAGE_LABELS_RU = {
  "common": "Общий",
  "dwarvish": "Дварфийский",
  "elvish": "Эльфийский",
  "halfling": "Полуросличий",
  "gnomish": "Гномий",
  "orc": "Орочий",
  "draconic": "Драконий",
  "goblin": "Гоблинский",
  "infernal": "Инфернальный",
  "celestial": "Небесный",
  "giant": "Великаний",
  "primordial": "Первичный",
  "auran": "Ауран",
  "aquan": "Акван",
  "terran": "Терран",
  "ignan": "Игнан",
  "abyssal": "Бездонный",
  "sylvan": "Сильван",
  "undercommon": "Подобщий",
  "deep_speech": "Глубинная речь",
  "thieves_cant": "Воровской жаргон",
  "gith": "Гит",
  "quori": "Кворийский",
  "leonin": "Леонинский",
  "tabaxi": "Табаксийский",
  "vedalken": "Ведалкенский",
  "aarakocra": "Ааракокранский",
  "loxodon": "Локсодонский",
  "minotaur": "Минотаврийский"
};
const ASI_STAT_LABELS_RU = {
  "str": "Сила (STR)",
  "dex": "Ловкость (DEX)",
  "con": "Телосложение (CON)",
  "int": "Интеллект (INT)",
  "wis": "Мудрость (WIS)",
  "cha": "Харизма (CHA)"
};
let classes = [];
let races = [];
let raceChoiceState = { languageRequired: false, asiRequired: false, asiBonus: 1 };
function _sortByNameRu(a, b){
  const aName = String((a && (a.name_ru || a.name)) || "").trim();
  const bName = String((b && (b.name_ru || b.name)) || "").trim();
  const r = aName.localeCompare(bName, "ru", { sensitivity: "base" });
  if(r !== 0) return r;
  const aId = String((a && a.id) || "").trim();
  const bId = String((b && b.id) || "").trim();
  return aId.localeCompare(bId, "ru", { sensitivity: "base" });
}
let currentPreset = null;
let stats = {str:50,dex:50,con:50,int:50,wis:50,cha:50};

function getUID(){
  let uid = localStorage.getItem("uid");
  if(!uid){
    uid = String(Math.floor(1000000000 + Math.random()*9000000000));
    localStorage.setItem("uid", uid);
  }
  return Number(uid);
}
function getName(){
  let name = localStorage.getItem("name");
  if(!name){
    name = prompt("Имя игрока:", "Игрок");
    if(!name) name = "Игрок";
    localStorage.setItem("name", name);
  }
  return name;
}
function pointsUsed(){
  let total = 0;
  for(const k of STAT_KEYS){
    total += Math.floor((Number(stats[k] || 50) - 50) / 5);
  }
  return total;
}
function pointsLeft(){ return 20 - pointsUsed(); }
function renderStats(){
  const box = document.getElementById("statsBox");
  box.innerHTML = "";
  for(const k of STAT_KEYS){
    const row = document.createElement("div");
    row.className = "stat";
    row.innerHTML = `<b>${k.toUpperCase()}</b>`;
    const b1 = document.createElement("button");
    b1.textContent = "-";
    b1.onclick = () => changeStat(k, -5);
    row.appendChild(b1);
    const slider = document.createElement("input");
    slider.type = "range";
    slider.min = "0";
    slider.max = "100";
    slider.step = "5";
    slider.value = String(stats[k]);
    slider.oninput = () => setStat(k, Number(slider.value));
    row.appendChild(slider);
    const b2 = document.createElement("button");
    b2.textContent = "+";
    b2.onclick = () => changeStat(k, +5);
    row.appendChild(b2);
    const out = document.createElement("span");
    out.textContent = String(stats[k]);
    row.appendChild(out);
    box.appendChild(row);
  }
  document.getElementById("pointsLeft").textContent = String(pointsLeft());
}
function setMessage(text, ok){
  const el = document.getElementById("msg");
  el.className = "msg " + (ok ? "ok" : "err");
  el.textContent = text || "";
}
function setStat(key, value){
  stats[key] = Math.max(0, Math.min(100, value));
  renderStats();
}
function changeStat(key, delta){
  const next = Math.max(0, Math.min(100, Number(stats[key] || 50) + delta));
  stats[key] = next;
  renderStats();
}
function resetStats(){
  if(currentPreset && currentPreset.stats){
    stats = JSON.parse(JSON.stringify(currentPreset.stats));
  }else{
    stats = {str:50,dex:50,con:50,int:50,wis:50,cha:50};
  }
  renderStats();
}
function goSession(){
  location.href = "/s/" + SESSION_ID;
}
function setListItems(listEl, items){
  listEl.innerHTML = "";
  const values = Array.isArray(items) ? items.filter(Boolean) : [];
  if(values.length === 0){
    const li = document.createElement("li");
    li.className = "muted";
    li.textContent = "Нет данных";
    listEl.appendChild(li);
    return;
  }

  for(const it of values){
    const li = document.createElement("li");

    // строка — как раньше
    if(typeof it === "string"){
      li.textContent = it;
      listEl.appendChild(li);
      continue;
    }

    // объект {name, summary}
    const name = String(it.name || it.title || it.key || "").trim();
    const summary = String(it.summary || "").trim();

    if(name){
      const b = document.createElement("b");
      b.textContent = name;
      li.appendChild(b);
    }
    if(summary){
      const d = document.createElement("div");
      d.className = "muted";
      d.textContent = summary;
      li.appendChild(d);
    }

    // fallback
    if(!name && !summary){
      li.textContent = String(it);
    }

    listEl.appendChild(li);
  }
}
function setSubraceItems(listEl, subraces){
  listEl.innerHTML = "";
  const values = Array.isArray(subraces) ? subraces.filter(Boolean) : [];
  if(values.length === 0){
    const li = document.createElement("li");
    li.className = "muted";
    li.textContent = "Нет данных";
    listEl.appendChild(li);
    return;
  }

  for(const s of values){
    const li = document.createElement("li");

    // если подраса пришла строкой — просто печатаем
    if(typeof s === "string"){
      li.textContent = s;
      listEl.appendChild(li);
      continue;
    }

    const name = String(s.name_ru || s.name || s.key || "").trim() || "Подраса";
    const traits = Array.isArray(s.traits) ? s.traits : [];

    // нет trait'ов — просто имя
    if(traits.length === 0){
      li.textContent = name;
      listEl.appendChild(li);
      continue;
    }

    // есть traits — делаем раскрывашку
    const det = document.createElement("details");
    const sum = document.createElement("summary");
    sum.textContent = name;
    det.appendChild(sum);

    const ul = document.createElement("ul");
    ul.className = "race-list";

    const traitItems = traits
      .map(t => {
        if(!t) return null;
        const tName = String(t.name_ru || t.name || t.key || "").trim();
        const tSummary = String(t.summary_ru || t.summary || "").trim();
        if(!tName && !tSummary) return null;
        return {name: tName || t.key || "Особенность", summary: tSummary};
      })
      .filter(Boolean);

    setListItems(ul, traitItems);
    det.appendChild(ul);

    li.appendChild(det);
    listEl.appendChild(li);
  }
}

function normalizeLanguageKey(value){
  return String(value || "").trim().toLowerCase();
}

function buildLanguageOptions(allowedKeys){
  const rawKeys = Array.isArray(allowedKeys) ? allowedKeys : [];
  const normalized = rawKeys.map(normalizeLanguageKey).filter(Boolean);
  const uniqAllowed = Array.from(new Set(normalized));
  const keys = uniqAllowed.length > 0 ? uniqAllowed : Object.keys(LANGUAGE_LABELS_RU);
  return keys
    .map((k) => ({ key: k, label: LANGUAGE_LABELS_RU[k] || k }))
    .sort((a, b) => String(a.label).localeCompare(String(b.label), "ru", { sensitivity: "base" }));
}

function getCurrentRaceContext(raceId){
  const selectedRaceId = String(raceId || (document.getElementById("raceId") ? document.getElementById("raceId").value : "") || "").trim();
  const race = races.find(x => x && x.id === selectedRaceId) || null;
  const details = race && race.details ? race.details : {};
  const raceSubs = race && Array.isArray(race.subraces) ? race.subraces : [];
  const detailSubs = Array.isArray(details.subraces) ? details.subraces : [];
  const subraces = raceSubs.length > 0 ? raceSubs : detailSubs;
  const selectedSubraceId = String((document.getElementById("subraceId") ? document.getElementById("subraceId").value : "") || "").trim().toLowerCase();
  const selectedSubrace = subraces.find((sr) => {
    if(!sr || typeof sr !== "object") return false;
    return String(sr.key || "").trim().toLowerCase() === selectedSubraceId;
  }) || null;
  const baseTraits = Array.isArray(details.traits) ? details.traits.filter(Boolean) : [];
  const subTraits = selectedSubrace && Array.isArray(selectedSubrace.traits) ? selectedSubrace.traits.filter(Boolean) : [];
  const raceKey = String((race && race.id) || "").trim().toLowerCase();
  const subraceKey = String((selectedSubrace && selectedSubrace.key) || "").trim().toLowerCase();
  const effectiveTraits = (raceKey === "human" && subraceKey === "variant_human")
    ? subTraits
    : (selectedSubrace ? [...baseTraits, ...subTraits] : baseTraits);

  return { race, details, subraces, selectedSubrace, effectiveTraits };
}

function getLanguageChoiceConfig(traits){
  const out = { required: false, allowAny: false, allowedKeys: [] };
  const items = Array.isArray(traits) ? traits : [];

  for(const t of items){
    if(!t || typeof t !== "object") continue;
    const mech = (t.mechanics && typeof t.mechanics === "object") ? t.mechanics : {};
    const mtype = String(mech.type || "").trim().toLowerCase();
    const countRaw = Number(mech.count ?? mech.choose ?? 1);
    const count = Number.isFinite(countRaw) ? countRaw : 1;
    if(count <= 0) continue;

    if(mtype === "choose_language"){
      out.required = true;
      out.allowAny = true;
      continue;
    }
    if(mtype !== "language_choice" && mtype !== "choice"){
      continue;
    }

    const from = mech.from;
    if(Array.isArray(from)){
      const vals = from.map(normalizeLanguageKey).filter(Boolean);
      if(vals.includes("any") || vals.includes("any_language")){
        out.required = true;
        out.allowAny = true;
      }else if(vals.length > 0){
        out.required = true;
        out.allowedKeys.push(...vals);
      }
      continue;
    }

    const fromKey = normalizeLanguageKey(from);
    if(fromKey === "any" || fromKey === "any_language" || !fromKey){
      out.required = true;
      out.allowAny = true;
    }else{
      out.required = true;
      out.allowedKeys.push(fromKey);
    }
  }

  return out;
}

function getAsiChoiceConfig(traits){
  const out = { required: false, choices: 0, bonus: 0 };
  const items = Array.isArray(traits) ? traits : [];
  for(const t of items){
    if(!t || typeof t !== "object") continue;
    const mech = (t.mechanics && typeof t.mechanics === "object") ? t.mechanics : {};
    const mtype = String(mech.type || "").trim().toLowerCase();
    if(mtype !== "choose_asi"){
      continue;
    }
    const choices = Number(mech.choices ?? mech.count ?? 0);
    const bonus = Number(mech.bonus ?? 0);
    if(choices === 2 && bonus === 1){
      out.required = true;
      out.choices = 2;
      out.bonus = 1;
      return out;
    }
  }
  return out;
}

function fillAsiSelect(sel, prev){
  if(!sel) return;
  const prevValue = String(prev || "");
  sel.innerHTML = "";
  const first = document.createElement("option");
  first.value = "";
  first.textContent = "(выберите характеристику)";
  sel.appendChild(first);
  for(const key of STAT_KEYS){
    const opt = document.createElement("option");
    opt.value = key;
    opt.textContent = ASI_STAT_LABELS_RU[key] || key.toUpperCase();
    sel.appendChild(opt);
  }
  const keepPrev = Array.from(sel.options).some(o => String(o.value) === prevValue);
  sel.value = keepPrev ? prevValue : "";
}

function renderRaceChoices(){
  const block = document.getElementById("raceChoices");
  const langRow = document.getElementById("choiceLangRow");
  const langSel = document.getElementById("choiceLang1");
  const asiRow = document.getElementById("choiceAsiRow");
  const asiSel1 = document.getElementById("choiceAsi1");
  const asiSel2 = document.getElementById("choiceAsi2");
  if(!block || !langRow || !langSel || !asiRow || !asiSel1 || !asiSel2) return;

  const ctx = getCurrentRaceContext();
  const langCfg = getLanguageChoiceConfig(ctx.effectiveTraits);
  const asiCfg = getAsiChoiceConfig(ctx.effectiveTraits);
  const needsLanguage = !!langCfg.required;
  const needsAsi = !!asiCfg.required;
  raceChoiceState = { languageRequired: needsLanguage, asiRequired: needsAsi, asiBonus: asiCfg.bonus || 1 };

  if(!needsLanguage && !needsAsi){
    block.style.display = "none";
    langRow.style.display = "none";
    asiRow.style.display = "none";
    langSel.disabled = true;
    langSel.required = false;
    langSel.value = "";
    asiSel1.disabled = true;
    asiSel1.required = false;
    asiSel1.value = "";
    asiSel2.disabled = true;
    asiSel2.required = false;
    asiSel2.value = "";
    return;
  }

  if(needsLanguage){
    const prev = String(langSel.value || "");
    langSel.innerHTML = "";
    const first = document.createElement("option");
    first.value = "";
    first.textContent = "(выберите язык)";
    langSel.appendChild(first);

    const options = buildLanguageOptions(langCfg.allowAny ? [] : langCfg.allowedKeys);
    for(const item of options){
      const opt = document.createElement("option");
      opt.value = item.key;
      opt.textContent = item.label;
      langSel.appendChild(opt);
    }
    const keepPrev = Array.from(langSel.options).some(o => String(o.value) === prev);
    langSel.value = keepPrev ? prev : "";
    langRow.style.display = "";
    langSel.disabled = false;
    langSel.required = true;
  }else{
    langRow.style.display = "none";
    langSel.disabled = true;
    langSel.required = false;
    langSel.value = "";
  }

  if(needsAsi){
    const prev1 = String(asiSel1.value || "");
    const prev2 = String(asiSel2.value || "");
    fillAsiSelect(asiSel1, prev1);
    fillAsiSelect(asiSel2, prev2);
    asiRow.style.display = "";
    asiSel1.disabled = false;
    asiSel1.required = true;
    asiSel2.disabled = false;
    asiSel2.required = true;
  }else{
    asiRow.style.display = "none";
    asiSel1.disabled = true;
    asiSel1.required = false;
    asiSel1.value = "";
    asiSel2.disabled = true;
    asiSel2.required = false;
    asiSel2.value = "";
  }

  block.style.display = "";
}

function renderSubraceSelect(race, details){
  const row = document.getElementById("subraceRow");
  const sel = document.getElementById("subraceId");
  if(!row || !sel) return;

  const raceSubs = race && Array.isArray(race.subraces) ? race.subraces : [];
  const detailSubs = details && Array.isArray(details.subraces) ? details.subraces : [];
  const subs = (raceSubs.length > 0 ? raceSubs : detailSubs).filter(Boolean);
  const prev = String(sel.value || "");

  sel.innerHTML = "";

  const opt0 = document.createElement("option");
  opt0.value = "";
  opt0.textContent = "(нет)";
  sel.appendChild(opt0);

  for(const sr of subs){
    if(!sr) continue;
    if(typeof sr === "string") continue;
    const key = String(sr.key || "").trim();
    if(!key) continue;
    const name = String(sr.name_ru || sr.name || sr.key || "Подраса").trim();
    const opt = document.createElement("option");
    opt.value = key;
    opt.textContent = name;
    sel.appendChild(opt);
  }

  const hasOptions = sel.options.length > 1;
  row.style.display = hasOptions ? "" : "none";
  sel.disabled = !hasOptions;
  sel.onchange = () => {
    const raceSel = document.getElementById("raceId");
    renderRaceDetails(raceSel ? raceSel.value : "");
  };

  if(!hasOptions){
    sel.value = "";
    return;
  }

  // try to keep previous choice if still valid
  const ok = Array.from(sel.options).some(o => String(o.value) === prev);
  sel.value = ok ? prev : "";
}

function renderRaceDetails(raceId){
  const titleEl = document.getElementById("raceTitle");
  const textEl = document.getElementById("raceText");
  const traitsEl = document.getElementById("raceTraits");
  const subracesEl = document.getElementById("raceSubraces");
  const before = getCurrentRaceContext(raceId);
  renderSubraceSelect(before.race, before.details);
  const ctx = getCurrentRaceContext(raceId);
  const race = ctx.race;
  const details = ctx.details;
  const subraces = ctx.subraces;
  const title = (details.name_ru || (race ? race.name : "") || raceId || "Раса");
  const description = (details.description_ru || details.notes_ru || "Описание будет добавлено позже.");
  titleEl.textContent = String(title);
  textEl.textContent = String(description);

  const traits = Array.isArray(ctx.effectiveTraits)
    ? ctx.effectiveTraits.map(t => {
        if(!t) return null;
        const name = String(t.name_ru || t.name || t.key || "").trim();
        const summary = String(t.summary_ru || t.summary || "").trim();
        if(!name && !summary) return null;
        return {name: name || String(t.key || "Особенность"), summary};
      }).filter(Boolean)
    : [];
  setListItems(traitsEl, traits);
  setSubraceItems(subracesEl, subraces);
  renderRaceChoices();
}
function renderClassDetails(classId){
  const titleEl = document.getElementById("classTitle");
  const textEl = document.getElementById("classText");
  const abilitiesEl = document.getElementById("classAbilities");
  const savesEl = document.getElementById("classSaves");
  const subclassesEl = document.getElementById("classSubclasses");

  const cls = classes.find(x => x.id === classId) || null;
  const details = (cls && cls.details) ? cls.details : {};

  const title = (details.name_ru || (cls ? cls.name : "") || classId || "Класс");
  const description = (details.description_ru || "Описание будет добавлено позже.");

  titleEl.textContent = String(title);
  textEl.textContent = String(description);

  const abilities = Array.isArray(details.primary_abilities)
    ? details.primary_abilities.map(x => String(x)).filter(Boolean)
    : [];
  const saves = Array.isArray(details.saving_throws)
    ? details.saving_throws.map(x => String(x)).filter(Boolean)
    : [];
  const subclasses = Array.isArray(cls && cls.subclasses)
    ? cls.subclasses.map(x => {
        if(!x) return "";
        if(typeof x === "string") return x;
        return String(x.name_ru || x.name || x.key || "");
      }).filter(Boolean)
    : [];

  setListItems(abilitiesEl, abilities);
  setListItems(savesEl, saves);
  setListItems(subclassesEl, subclasses);
}
async function ensureJoined(){
  const r = await fetch("/api/join", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({session_id: SESSION_ID, uid: getUID(), name: getName()})
  });
  if(!r.ok){
    const data = await r.json();
    throw new Error(data.detail || "join error");
  }
}
async function loadClasses(){
  const r = await fetch("/api/classes");
  const data = await r.json();

  classes = data.classes || [];
  classes.sort(_sortByNameRu);

  const sel = document.getElementById("classId");
  sel.innerHTML = "";

  for(const it of classes){
    const opt = document.createElement("option");
    opt.value = it.id;
    opt.textContent = `${it.name} (HP ${it.hp_max}, STA ${it.sta_max})`;
    sel.appendChild(opt);
  }

  sel.onchange = () => {
    currentPreset = classes.find(x => x.id === sel.value) || null;
    resetStats();
    renderClassDetails(sel.value);
  };

  currentPreset = classes[0] || null;
  resetStats();
  renderClassDetails(sel.value || (classes[0] && classes[0].id) || "");
}
async function loadRaces(){
  const r = await fetch("/api/races");
  const data = await r.json();
  races = data.races || [];
  races.sort(_sortByNameRu);
  const sel = document.getElementById("raceId");
  sel.innerHTML = "";
  for(const it of races){
    const opt = document.createElement("option");
    opt.value = it.id;
    opt.textContent = `${it.name} (${it.speed_ft} ft)`;
    sel.appendChild(opt);
  }
  sel.onchange = () => renderRaceDetails(sel.value);
  renderRaceDetails(sel.value || (races[0] && races[0].id) || "");
}
async function createHero(){
  const name = (document.getElementById("charName").value || "").trim();
  const classId = (document.getElementById("classId").value || "").trim();
  const customClass = (document.getElementById("customClass").value || "").trim();
  if(!name){
    setMessage("Имя персонажа обязательно", false);
    return;
  }
  const choiceLangEl = document.getElementById("choiceLang1");
  const choiceLang = String(choiceLangEl ? choiceLangEl.value : "").trim().toLowerCase();
  if(raceChoiceState.languageRequired && !choiceLang){
    setMessage("Выбери доп. язык в блоке «Стартовые выборы».", false);
    return;
  }
  const choiceAsi1El = document.getElementById("choiceAsi1");
  const choiceAsi2El = document.getElementById("choiceAsi2");
  const choiceAsi1 = String(choiceAsi1El ? choiceAsi1El.value : "").trim().toLowerCase();
  const choiceAsi2 = String(choiceAsi2El ? choiceAsi2El.value : "").trim().toLowerCase();
  if(raceChoiceState.asiRequired){
    if(!choiceAsi1 || !choiceAsi2){
      setMessage("Выбери две характеристики для ASI в блоке «Стартовые выборы».", false);
      return;
    }
    if(choiceAsi1 === choiceAsi2){
      setMessage("Для ASI нужно выбрать две разные характеристики.", false);
      return;
    }
  }
  const payload = {
    session_id: SESSION_ID,
    uid: getUID(),
    name,
    class_id: classId,
    custom_class: customClass,
    race_id: (document.getElementById("raceId").value || "").trim(),
    subrace_id: (document.getElementById("subraceId") ? (document.getElementById("subraceId").value || "").trim() : ""),
    custom_race: (document.getElementById("customRace").value || "").trim(),
    stats,
    gender: (document.getElementById("gender").value || "").trim(),
    race: "",
    description: (document.getElementById("desc").value || "").trim(),
  };
  const raceChoices = {};
  if(choiceLang){
    raceChoices.languages = [choiceLang];
  }
  if(raceChoiceState.asiRequired){
    raceChoices.asi = [
      {stat: choiceAsi1, bonus: 1},
      {stat: choiceAsi2, bonus: 1},
    ];
  }
  if(Object.keys(raceChoices).length > 0){
    payload.race_choices = raceChoices;
  }
  const r = await fetch("/api/character/create", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify(payload)
  });
  const data = await r.json();
  if(r.status === 409){
    setMessage("Character already created. Go to session.", false);
    return;
  }
  if(!r.ok){
    setMessage(data.detail || "Ошибка создания персонажа", false);
    return;
  }
  const next = (data && data.next_url) ? String(data.next_url) : ("/s/" + SESSION_ID);
  setMessage("Персонаж создан. Переход...", true);
  setTimeout(() => { location.href = next; }, 250);
}

async function init(){
  document.getElementById("sid").textContent = SESSION_ID;
  try{
    await ensureJoined();
    const meResp = await fetch(`/api/character/me?session_id=${encodeURIComponent(SESSION_ID)}&uid=${encodeURIComponent(String(getUID()))}`);
    const meData = await meResp.json();
    if(meResp.ok && meData.has_character){
      setMessage("Character already created. Go to session.", false);
      return;
    }
    await loadClasses();
    await loadRaces();
    setMessage("Заполни данные и нажми Create Hero.", true);
  }catch(e){
    setMessage(String(e.message || e), false);
  }
}
init();
</script>
